<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="cylinder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle Glow -->
  <circle cx="256" cy="270" r="160" fill="#f59e0b" opacity="0.15" filter="blur(30px)" />
  
  <!-- Cylinder Graphic -->
  <g transform="translate(156, 120)">
    <!-- Cylinder Cap / Valve Guard -->
    <rect x="60" y="20" width="80" height="25" rx="12" fill="#94a3b8" />
    <rect x="85" y="5" width="30" height="20" rx="5" fill="#cbd5e1" />
    
    <!-- Cylinder Main Body -->
    <rect x="25" y="45" width="150" height="230" rx="40" fill="url(#cylinder)" />
    
    <!-- Cylinder Rings -->
    <rect x="25" y="110" width="150" height="12" fill="#9a3412" opacity="0.4" />
    <rect x="25" y="190" width="150" height="12" fill="#9a3412" opacity="0.4" />
    
    <!-- Cylinder Base -->
    <rect x="45" y="270" width="110" height="18" rx="8" fill="#94a3b8" />
    
    <!-- Flame Badge -->
    <path d="M100 80 C80 120, 60 145, 60 175 C60 205, 80 225, 100 225 C120 225, 140 205, 140 175 C140 145, 120 120, 100 80 Z" fill="url(#flame)" />
    <path d="M100 130 C90 150, 80 165, 80 185 C80 200, 90 210, 100 210 C110 210, 120 200, 120 185 C120 165, 110 150, 100 130 Z" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
