name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/LPG-Hisab-Kitab.apk
          ls -lh release-apk/

      - name: Upload APK as GitHub Release (Direct .apk Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "LPG Hisab Kitab v1.0 (Android APK)"
          body: |
            ### 📱 LPG Gas Cylinder Calculator Android APK
            براہ راست APK ڈاؤن لوڈ کریں اور اپنے موبائل میں انسٹال کریں:
            - **LPG-Hisab-Kitab.apk**
            - 100% آف لائن سپورٹ
          files: release-apk/LPG-Hisab-Kitab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LPG-Hisab-Kitab-apk
          path: release-apk/LPG-Hisab-Kitab.apk
          if-no-files-found: error
