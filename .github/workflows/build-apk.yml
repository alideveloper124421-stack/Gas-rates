name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Run Logic Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for User
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/LPG-Hisab-Kitab-v1.0.apk
          echo "APK generated successfully at release-apk/LPG-Hisab-Kitab-v1.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LPG-Hisab-Kitab-Android-APK
          path: release-apk/LPG-Hisab-Kitab-v1.0.apk
          if-no-files-found: error
          retention-days: 30
